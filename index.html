<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><title>みんなの年齢計算</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 40px;max-width:650px;margin-inline:auto}header{padding:28px 0 15px}h1{font-size:26px;margin:0 0 7px}p{color:#64748b;font-size:13px;line-height:1.5}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 18px #1e293b0c}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:#fff;color:#172033;min-height:46px}button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white;width:100%;margin-top:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.person{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #e9eef5}.person:last-child{border:0}.person-main{flex:1;min-width:0}.name{font-weight:700;overflow-wrap:anywhere}.dob{font-size:13px;color:#64748b;margin-top:4px}.age{font-size:22px;font-weight:800;color:#1d4ed8;white-space:nowrap}.delete{background:#fee2e2;color:#991b1b;padding:9px 11px;font-size:13px}.muted{color:#64748b;text-align:center;padding:20px 0}.count{font-size:13px;color:#64748b;font-weight:500}#error{color:#b91c1c;font-size:13px;margin-top:8px}footer{text-align:center;margin-top:20px}</style></head><body><header><h1>🎂 みんなの年齢計算</h1><p>生年月日を登録して、指定日時点の満年齢を一覧表示します。</p></header><section class="card"><label for="asof">年齢を計算する基準日</label><input id="asof" type="date"><p>基準日を変えると全員の年齢が自動更新されます。</p></section><section class="card"><h2 style="font-size:18px;margin-top:0">人を追加</h2><form id="form"><label for="name">氏名・ニックネーム</label><input id="name" placeholder="例：Aさん" required maxlength="80" autocomplete="off"><div style="height:13px"></div><label for="birth">生年月日</label><input id="birth" type="date" required><div id="error" role="alert"></div><button class="primary" type="submit">＋ 登録する</button></form></section><section class="card"><h2 style="font-size:18px;margin:0">登録一覧 <span class="count" id="count"></span></h2><div id="list"></div></section><footer><p>登録情報はこのブラウザ内に保存されます。Safariの履歴・Webサイトデータを消去すると失われる場合があります。</p></footer><script>const KEY='age-calculator-people-v1';const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const today=new Date();$('asof').value=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;let people=[];try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))people=data.filter(p=>p&&typeof p.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.birth));}catch(e){}function parse(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?{y,m,d}:null}function age(b,a){let v=a.y-b.y;if(a.m<b.m||(a.m===b.m&&a.d<b.d))v--;return v}function save(){try{localStorage.setItem(KEY,JSON.stringify(people));return true}catch(e){$('error').textContent='保存できませんでした。Safariの保存設定をご確認ください。';return false}}function render(){const box=$('list');box.replaceChildren();$('count').textContent=`（${people.length}人）`;const a=parse($('asof').value);if(!people.length){const e=document.createElement('div');e.className='muted';e.textContent='まだ登録がありません';box.append(e);return}people.forEach((p,i)=>{const item=document.createElement('div');item.className='person';const main=document.createElement('div');main.className='person-main';const n=document.createElement('div');n.className='name';n.textContent=p.name;const d=document.createElement('div');d.className='dob';d.textContent=p.birth.replaceAll('-','/');main.append(n,d);const years=document.createElement('div');years.className='age';const b=parse(p.birth);years.textContent=!a||!b?'—':age(b,a)<0?'未出生':`${age(b,a)}歳`;const del=document.createElement('button');del.className='delete';del.textContent='削除';del.setAttribute('aria-label',`${p.name}を削除`);del.onclick=()=>{if(confirm(`${p.name}を削除しますか？`)){people.splice(i,1);save();render()}};item.append(main,years,del);box.append(item)})}$('form').addEventListener('submit',e=>{e.preventDefault();$('error').textContent='';const name=$('name').value.trim(),birth=$('birth').value;if(!name||!parse(birth)){$('error').textContent='氏名と正しい生年月日を入力してください。';return}people.push({name,birth});save();$('name').value='';$('birth').value='';render();$('name').focus()});$('asof').addEventListener('change',render);render();</script></body></html>
